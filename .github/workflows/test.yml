name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  vitest:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

      - name: Install shdoc-ng
        run: brew install jdevera/tap/shdoc-ng

      - name: Check shell documentation
        run: npm run docs:check

      - name: Generate MoyaForge shell documentation
        run: npm run docs:generate

      - name: Verify generated documentation is current
        run: git diff --exit-code -- docs/03-reference/01-cli/page.mdx
