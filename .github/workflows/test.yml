name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  vitest:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Print generated lockfile
        run: |
          echo "__PACKAGE_LOCK_START__"
          cat package-lock.json
          echo "__PACKAGE_LOCK_END__"

      - name: Run Vitest
        run: npm test
